# Drop Ceiling — Deploy viewer + reports + grid-designer to GitHub Pages
#
# Pages serves ONE bundle for the whole site, so every deploy builds all of it:
#   /                  the public viewer and daily reports, from main
#   /grid-designer/    the planning tool and its structure sheet, built from the
#                      v3-drift-tiling branch (it has not been merged to main)
#
# This must run on main: the github-pages environment only accepts deploys from
# main. A push to v3-drift-tiling reaches it through grid-designer-pages.yml,
# which lives on that branch and dispatches this workflow with --ref main.
#
# Triggers:
#   1. Push to main (any change to viewer, reports, or this file)
#   2. Manual dispatch from Actions tab — also how grid-designer redeploys
#   3. Repository dispatch (called from device after generating reports)
#      curl -X POST \
#        -H "Authorization: token $GITHUB_TOKEN" \
#        -H "Accept: application/vnd.github.v3+json" \
#        https://api.github.com/repos/npuckett/dc-dev/dispatches \
#        -d '{"event_type":"deploy-reports"}'
#
name: Deploy to Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'IO/public-viewer/**'
      - 'IO/reports/daily/**'
      - '.github/workflows/static.yml'

  repository_dispatch:
    types: [deploy-reports]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout grid-designer (v3-drift-tiling)
        uses: actions/checkout@v4
        with:
          ref: v3-drift-tiling
          path: gd-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gd-src/grid-designer/package-lock.json

      - name: Build grid-designer and its structure sheet
        working-directory: gd-src/grid-designer
        run: |
          npm ci
          npx vite build
          # the sheet, regenerated from the code being deployed so the public
          # numbers and drawings cannot lag behind the public model
          node scripts/structure-sheet.mjs - dist/sheet
          # the artifact-body variant has no doctype; Pages serves index.html
          rm -f dist/sheet/structure-sheet.html

      - name: Assemble site
        run: |
          mkdir -p _site/reports/daily

          # Copy the public-viewer files to site root
          cp IO/public-viewer/*.html _site/
          cp IO/public-viewer/*.css  _site/
          cp IO/public-viewer/*.js   _site/
          cp IO/public-viewer/*.png  _site/ 2>/dev/null || true

          # Copy report JSON data
          cp IO/reports/daily/*.json _site/reports/daily/

          # grid-designer at /grid-designer/ (relative asset base, see its vite.config.js)
          cp -r gd-src/grid-designer/dist _site/grid-designer

      - name: Fix report paths for root-level hosting
        run: |
          # reports.js references '../reports/daily' because locally it's
          # served from IO/ with public-viewer/ as a subdirectory.
          # On Pages, everything is at the root, so fix the path.
          sed -i "s|'../reports/daily'|'./reports/daily'|g" _site/reports.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
