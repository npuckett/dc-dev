<polygon points="206.78,43.84 342.78,43.84 342.78,30.24 206.78,30.24" class="sec-bar"/>
<line x1="274.8" y1="15.8" x2="274.8" y2="133.1" class="axis"/>
<text x="274.8" y="255.6" class="sec-title" text-anchor="middle">P00 · convex +20°</text>
<text x="274.8" y="279.6" class="sec-sub" text-anchor="middle">44 off · built for 20 mm · joints 22 mm</text>
</g>
<g class="section">
<polygon points="564.55,148.13 611.43,156.39 682.21,72.20 783.25,86.57 789.74,49.74 740.11,37.53 737.96,49.69 586.62,23.00" class="sec-panel"/>
<polygon points="1062.04,23.00 910.70,49.69 908.56,37.53 858.92,49.74 865.42,86.57 966.46,72.20 1037.23,156.39 1084.11,148.13" class="sec-panel"/>
<polygon points="701.97,104.82 946.69,104.82 946.69,77.59 863.35,89.52 859.36,66.92 789.30,66.92 785.31,89.52 701.97,77.59" class="sec-back"/>
<polygon points="756.33,43.84 892.33,43.84 892.33,30.24 756.33,30.24" class="sec-bar"/>
<line x1="824.3" y1="15.8" x2="824.3" y2="116.7" class="axis"/>
<text x="824.3" y="255.6" class="sec-title" text-anchor="middle">P01 · concave −20°</text>
<text x="824.3" y="279.6" class="sec-sub" text-anchor="middle">30 off · built for 20 mm · joints 22 mm</text>
</g>
<g class="scale"><line x1="8" y1="291.6" x2="42.0" y2="291.6"/><text x="25.0" y="283.6" text-anchor="middle">10 mm</text></g>
</svg>
